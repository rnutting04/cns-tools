services:

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - postgres

  # S3-compatible object storage for local development.
  #
  # This was minio/minio until MinIO deleted its public images in September
  # 2026 (Docker Hub returns 404; the quay.io mirror now refuses anonymous
  # pulls), which broke `docker compose pull` outright. SeaweedFS is a
  # maintained, still-public drop-in that speaks the S3 API.
  #
  # It stays on port 9000 so existing .env files keep working unchanged.
  # Anonymous access is allowed, so SPACES_KEY/SPACES_SECRET can be any
  # non-empty values locally — boto3 still signs, SeaweedFS just doesn't check.
  s3:
    image: chrislusf/seaweedfs:3.97
    ports:
      - "9000:9000"
    # -ip is the address the master, volume and filer components advertise to
    # each other, so it must be routable: 0.0.0.0 is a valid bind address but
    # not a valid destination, and object writes hang retrying it. -ip.bind
    # keeps the listeners on all interfaces so Docker's port map still works.
    command: >-
      server -dir=/data -s3 -s3.port=9000
      -ip=localhost -ip.bind=0.0.0.0
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  s3_data:
  redis_data:
name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Run frontend tests
        run: npm run test:coverage

      - name: Lint frontend
        run: npm run lint

      - name: Format check frontend (prettier)
        run: npx prettier --check "src/**/*.{ts,tsx}"

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cs_user
          POSTGRES_PASSWORD: localpassword
          POSTGRES_DB: cs_tool_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cs_user -d cs_tool_hub"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://cs_user:localpassword@localhost:5432/cs_tool_hub
      SECRET_KEY: ci_secret_key
      # No object-storage container runs in CI. StorageService is lazy and
      # every test mocks its methods, so these only have to satisfy Settings'
      # required fields — nothing connects to this endpoint.
      SPACES_ENDPOINT: http://localhost:9000
      SPACES_KEY: ci_access_key
      SPACES_SECRET: ci_secret_key
      SPACES_BUCKET: cs-tool-hub
      ANTHROPIC_API_KEY: sk-ant-ci-placeholder
      CELERY_TASK_ALWAYS_EAGER: true
      CELERY_BROKER_URL: memory://
      CELERY_RESULT_BACKEND: cache+memory://

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y curl

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U cs_user -d cs_tool_hub; do
            echo "Waiting for Postgres..."
            sleep 2
          done

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Backend import check
        run: python -c "from app.main import app; print('Backend import OK')"

      - name: Lint backend (ruff)
        run: ruff check .

      - name: Format check backend (ruff)
        run: ruff format --check .

      - name: Run backend tests
        # The test suite creates and uses a separate `cs_tool_hub_test` database
        # (see tests/conftest.py); the CI Postgres user can CREATE DATABASE.
        run: pytest --cov=app --cov-report=term-missing

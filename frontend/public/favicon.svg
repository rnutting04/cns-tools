<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- C&S mark. At favicon size the printed lockup's wordmark is unreadable,
       so only the three letterforms survive the reduction. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9A7B16"/>
      <stop offset="45%" stop-color="#E0BE5E"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="#13294B"/>
  <text x="5" y="47" font-family="Georgia,'Times New Roman',serif" font-size="46" font-weight="700" fill="#FFFFFF">C</text>
  <text x="59" y="47" text-anchor="end" font-family="Georgia,'Times New Roman',serif" font-size="46" font-weight="700" fill="#FFFFFF">S</text>
  <text x="32" y="44" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="42" font-style="italic" font-weight="700" fill="url(#g)">&amp;</text>
</svg>

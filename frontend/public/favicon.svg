<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- C&S mark reduced to the brand's gold ampersand. At tab size (16px) the
       full C & S letterforms overlap into a blur; a single glyph stays crisp. -->
  <rect width="64" height="64" rx="14" fill="#13294B"/>
  <text x="32" y="50" text-anchor="middle"
        font-family="Georgia,'Times New Roman',serif" font-size="52"
        font-style="italic" font-weight="700" fill="#E0BE5E">&amp;</text>
</svg>
